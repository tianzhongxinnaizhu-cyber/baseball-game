<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baseball GM</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#111827">
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f5f8;color:#15202b;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}
.box{background:#fff;border:1px solid #dde3ea;border-radius:16px;padding:28px;max-width:520px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(15,23,42,.08)}
h1{margin:0 0 10px;font-size:28px}
p{margin:0;color:#596574;line-height:1.7}
</style>
</head>
<body>
<div class="box">
<h1>Baseball GM</h1>
<p id="status">ゲームを読み込んでいます…</p>
</div>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(console.warn);
}
(async()=>{
  const status = document.getElementById("status");
  try{
    if (!("DecompressionStream" in window)) {
      throw new Error("このブラウザは圧縮データの展開に対応していません。Chrome / Edge / Firefox / Safari の新しい版で開いてください。");
    }
    const files = Array.from({length:9},(_,i)=>`./data/part-${String(i).padStart(2,"0")}.txt`);
    const parts = await Promise.all(files.map(async f=>{
      const r = await fetch(f);
      if(!r.ok) throw new Error(`${f} の読み込みに失敗しました`);
      return (await r.text()).trim();
    }));
    const b64 = parts.join("");
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    status.textContent = "読み込みに失敗しました。ページを再読み込みしてください。";
    const detail = document.createElement("small");
    detail.style.display="block";
    detail.style.marginTop="12px";
    detail.style.color="#b42318";
    detail.textContent=e.message || String(e);
    status.after(detail);
  }
})();
</script>
</body>
</html>
